name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  branch-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR source branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          PATTERN='^(feat|fix|chore|docs|refactor|test|perf|ci|seo|hotfix)/[a-z0-9]+(-[a-z0-9]+)*$'
          if [ "${#HEAD_REF}" -gt 64 ] || ! [[ "$HEAD_REF" =~ $PATTERN ]]; then
            echo "::error::Branch '$HEAD_REF' violates docs/agents/BRANCH_POLICY.md."
            echo "Allowed format (<= 64 chars): ^(feat|fix|chore|docs|refactor|test|perf|ci|seo|hotfix)/[a-z0-9]+(-[a-z0-9]+)*$"
            echo "Valid examples: feat/seo-geo-growth, fix/sitemap-lastmod, seo/schema-faq, ci/pr-gates"
            exit 1
          fi
          echo "Branch '$HEAD_REF' complies with BRANCH_POLICY.md"

  seo-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@v2

      - name: Run SEO & GEO contract suite
        run: cargo test --locked --test seo --test seo_contracts

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Install OCR & PDF tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por poppler-utils

      - name: Run test suite
        run: cargo test --locked

      - name: Run deploy agent unit tests
        run: python3 -m unittest discover -s deploy/vps -p 'test_*.py' -v

      - name: Check release build
        run: cargo build --release --locked

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Security audit
        run: cargo audit
