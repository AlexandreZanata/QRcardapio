<div class="lang-switcher" role="group" aria-label="{{ page.t("lang.switcher_label") }}" data-i18n-aria="lang.switcher_label">
  <a href="?lang=pt-BR"
     class="lang-btn {% if page.locale_code == "pt-BR" %}is-active{% endif %}"
     data-lang-btn="pt-BR"
     aria-pressed="{% if page.locale_code == "pt-BR" %}true{% else %}false{% endif %}">PT</a>
  <a href="?lang=en"
     class="lang-btn {% if page.locale_code == "en" %}is-active{% endif %}"
     data-lang-btn="en"
     aria-pressed="{% if page.locale_code == "en" %}true{% else %}false{% endif %}">EN</a>
  <a href="?lang=es"
     class="lang-btn {% if page.locale_code == "es" %}is-active{% endif %}"
     data-lang-btn="es"
     aria-pressed="{% if page.locale_code == "es" %}true{% else %}false{% endif %}">ES</a>
</div>
