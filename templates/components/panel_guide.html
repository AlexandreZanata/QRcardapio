{% import "components/icons.html" as icons %}

<dialog class="panel-guide" id="panel-guide" aria-labelledby="panel-guide-title">
  <svg class="panel-guide-shade" aria-hidden="true" focusable="false">
    <path data-guide-shade fill-rule="evenodd"></path>
    <rect data-guide-outline rx="9"></rect>
  </svg>
  <div class="panel-guide-card">
    <div class="panel-guide-header">
      <h2 id="panel-guide-title">{{ icons::panel("guide") }} <span data-i18n="guide.title">{{ page.t("guide.title") }}</span></h2>
      <button class="panel-guide-close" type="button" data-guide-close
              aria-label="{{ page.t("common.close") }}" data-i18n-aria="common.close">
        {{ icons::panel("close") }}
      </button>
    </div>
    <div class="panel-guide-instruction" aria-live="polite">
      <span class="panel-guide-count" data-guide-count></span>
      <p data-guide-message></p>
    </div>
    <div class="panel-guide-actions">
      <button class="btn btn-secondary" type="button" data-guide-back>
        {{ icons::panel("back") }} <span data-i18n="common.back">{{ page.t("common.back") }}</span>
      </button>
      <button class="btn btn-primary" type="button" data-guide-next>
        <span data-guide-continue data-i18n="common.continue">{{ page.t("common.continue") }}</span>
        <span data-guide-finish data-i18n="guide.finish" hidden>{{ page.t("guide.finish") }}</span>
        {{ icons::panel("next") }}
      </button>
    </div>
  </div>
</dialog>
