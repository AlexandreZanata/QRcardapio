{% macro links(is_logged_in) %}
  {% if is_logged_in %}
  <a class="btn landing-button landing-button-pink" href="/dashboard" data-i18n="landing.open_panel">{{ page.t("landing.open_panel") }}</a>
  {% else %}
  <a class="btn landing-button landing-login" href="/login" data-i18n="nav.login">{{ page.t("nav.login") }}</a>
  <a class="btn landing-button landing-button-pink" href="/register" data-i18n="landing.create_menu">{{ page.t("landing.create_menu") }}</a>
  {% endif %}
{% endmacro %}
