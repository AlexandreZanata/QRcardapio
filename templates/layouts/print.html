<!DOCTYPE html>
<html lang="{{ page.locale_code }}" data-i18n-version="{{ page.i18n_version }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.t(page.title_key) }}</title>
  <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/print.css">
  <link rel="stylesheet" href="/static/css/language-picker.css">
  <link rel="stylesheet" href="/dashboard/theme.css">
</head>
<body class="print-body" data-page-title-key="{{ page.title_key }}">
  {% block content %}{% endblock %}
  <script src="/static/js/i18n.js" defer></script>
  <script src="/static/js/language-picker.js" type="module"></script>
  <script src="/static/js/app.js" defer></script>
</body>
</html>
