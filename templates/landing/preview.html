{% import "components/icons.html" as icons %}

<figure class="landing-demo" id="demonstracao">
  <div class="demo-stage">
    <div class="demo-burst">{{ icons::sticker("burst") }}</div>
    <div class="demo-laptop">
      <div class="demo-laptop-screen">
        <img src="/static/images/landing-dashboard.webp"
             srcset="/static/images/landing-dashboard.webp 768w,
                     /static/images/landing-dashboard-1536.webp 1536w,
                     /static/images/landing-dashboard-4k.webp 3840w"
             sizes="(max-width: 53rem) min(76vw, 600px), (max-width: 100rem) 40vw, 600px"
             width="768" height="432" fetchpriority="high"
             alt="{{ page.t("landing.dashboard_alt") }}" data-i18n-aria="landing.dashboard_alt">
      </div>
    </div>
    <div class="demo-phone">
      <div class="demo-phone-inner">
        <img src="/static/images/landing-menu-540.webp"
             srcset="/static/images/landing-menu-540.webp 540w,
                     /static/images/landing-menu-1080.webp 1080w,
                     /static/images/landing-menu-4k.webp 2160w"
             sizes="(max-width: 53rem) min(27vw, 220px), (max-width: 100rem) 15vw, 220px"
             width="540" height="960"
             alt="{{ page.t("landing.phone_alt") }}" data-i18n-aria="landing.phone_alt">
      </div>
    </div>
    <div class="demo-qr" aria-hidden="true">
      <span data-i18n="landing.demo_qr">{{ page.t("landing.demo_qr") }}</span>
      <img src="/static/images/landing-demo-qr.svg" alt="" width="90" height="90">
    </div>
  </div>
  <figcaption>
    <span data-i18n="landing.demo_badge">{{ page.t("landing.demo_badge") }}</span>
    <div class="landing-demo-links">
      <a href="/static/images/landing-dashboard-4k.webp" data-i18n="landing.demo_expand">{{ page.t("landing.demo_expand") }}</a>
      <a href="/static/images/landing-menu-4k.webp" data-i18n="landing.demo_expand_menu">{{ page.t("landing.demo_expand_menu") }}</a>
    </div>
  </figcaption>
</figure>
