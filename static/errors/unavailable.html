<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tivemos uma falha no serviço — QR Cardápio</title>
  <link rel="stylesheet" href="/static/css/status.css">
</head>
<body class="status-edge">
  <main class="status-shell">
    <div class="status-card">
      <img class="status-art" src="/static/images/state-error.svg" width="480" height="330" alt="">
      <div class="status-copy">
        <h1 data-i18n="status.error_title">Tivemos uma falha no serviço</h1>
        <p data-i18n="error.internal">Ocorreu um erro inesperado. Tente novamente.</p>
        <a class="btn status-action" href="/" data-i18n="status.home">Voltar ao início</a>
      </div>
    </div>
  </main>
</body>
</html>
