[package]
name = "qrcardapio"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Multi-tenant digital menu SaaS with static atomic publication and zero-reload i18n"
license = "MIT"

[dependencies]
argon2 = "0.6.0"
askama = { version = "0.16.1", features = ["serde_json"] }
aws-lc-rs = { version = "1.19.0", default-features = false, features = ["non-fips"] }
axum = { version = "0.8.9", features = ["multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde", "clock"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
governor = "0.10.4"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
jiff = { version = "1.0.3", default-features = false, features = ["std", "static"] }
qrcode = { version = "0.15.0", default-features = false, features = ["svg", "image"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite-bundled", "migrate", "chrono"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "fs", "sync", "time", "net", "process"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "fs", "limit", "request-id", "sensitive-headers", "set-header", "trace", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1.29.3", features = ["v4", "v7"] }

[dev-dependencies]
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
